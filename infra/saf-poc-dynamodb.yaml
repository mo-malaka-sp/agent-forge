AWSTemplateFormatVersion: "2010-09-09"
Description: Durable state for the AgentForge SAF and Datadog POC

Parameters:
  TableName:
    Type: String
    Default: agentforge-saf-poc
  AmplifyComputeRoleName:
    Type: String
    Default: ""
    Description: Optional IAM role used by Amplify SSR compute

Conditions:
  AttachComputePolicy: !Not [!Equals [!Ref AmplifyComputeRoleName, ""]]

Resources:
  SafPocTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AmplifyComputePolicy:
    Type: AWS::IAM::Policy
    Condition: AttachComputePolicy
    Properties:
      PolicyName: AgentForgeSafPocDynamoDb
      Roles:
        - !Ref AmplifyComputeRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:DeleteItem
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
            Resource: !GetAtt SafPocTable.Arn

Outputs:
  TableName:
    Value: !Ref SafPocTable
  TableArn:
    Value: !GetAtt SafPocTable.Arn
